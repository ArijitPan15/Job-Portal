{% extends "base.html" %}

{% block title %}Candidate Profile Required - SkillMatch{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 text-center py-5">
    <div class="card p-5">
      <i class="bi bi-person-badge display-4 text-warning mb-3"></i>
      <h3 class="fw-bold mb-2">Candidate Profile Required</h3>
      <p class="text-muted">{{ message|default:'Only candidate accounts can run individual skill-gap analysis.' }}</p>
      <div class="d-flex justify-content-center gap-2 mt-3">
        <a href="{% url 'jobs:job_list' %}" class="btn btn-primary">Browse Jobs</a>
        <a href="{% url 'accounts:profile' %}" class="btn btn-outline-secondary">Go to Profile</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
